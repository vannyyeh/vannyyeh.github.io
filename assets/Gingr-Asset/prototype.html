// ─── Helpers ──────────────────────────────────────────────────────────────────
function fmtAge(raw){
  // "4y" → "4 years old", "1y" → "1 year old", "6m" → "6 months old"
  if(!raw) return raw;
  const my = raw.match(/^(\d+)y$/);
  if(my){ const n=parseInt(my[1]); return n===1?"1 year old":n+" years old"; }
  const mm = raw.match(/^(\d+)m$/);
  if(mm){ const n=parseInt(mm[1]); return n===1?"1 month old":n+" months old"; }
  return raw;
}

function inits(n){return n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();}
function initCard(petId, btType){
  const bt=btType||S.bt;
  const adns=ALL_ADDONS[bt];
  return{petId,btType:bt,svcId:SVCS[bt][0].id,date:"04/01/2026",time:"02:00 PM",
    groomer:"m1",addons:[adns[0]],instr:"",showAllAddons:false};
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render(){
  const el=document.getElementById("app");if(!el)return;
  const step=!S.cx?1:S.cards.length===0?2:3;

  if(S.confirmed){
    const allItems=S.cards.map(c=>{
      const svcs=SVCS[c.btType];
      const svc=svcs.find(x=>x.id===c.svcId)||svcs[0];
      const pet=S.cx.pets.find(p=>p.id===c.petId);
      const adnT=c.addons.reduce((t,a)=>t+a.price,0);
      return{pet,svc,addons:c.addons,sub:svc.price+adnT,bt:c.btType};
    });
    const grand=allItems.reduce((t,x)=>t+x.sub,0);
    el.innerHTML=`<div class="cfmd"><div class="cfmd-box">
      <div class="cfmd-ic">${IC.vax}</div>
      <div class="cfmd-t">Booking Confirmed!</div>
      <div class="cfmd-tx"><b>${S.cx.name}</b>'s appointment has been scheduled.</div>

      <div class="cfmd-tot">Total: $${grand}.00</div>

  // Stepper
  const stH=`<div class="stepper">

      return`${i>0?'<div class="sdivider"></div>':''}<div class="step${a?' active':''}">
        <div class="step-num ${a?'a':'i'}">${d?IC.chkGn:n}</div>

      </div>`;
    }).join("")}
  </div>`;

  // Customer section
  let cxSec="";
  if(!S.cx){
    const q=S.query.toLowerCase().trim();
    const res=q.length>1?CX.filter(c=>
      c.name.toLowerCase().includes(q)||c.phone.includes(q)||
      c.email.toLowerCase().includes(q)||c.pets.some(p=>p.name.toLowerCase().includes(q))
    ):[];
    if(!S.showNew){
      cxSec=`<div>
        <div class="sec-lbl">Customer</div><div class="sec-sub">Select or create a customer</div>
        <div class="card">
          <div class="search-row">
            <span class="find-lbl">Find a Customer</span>
            <button class="add-new-btn" onclick="showNewForm()">Add New Customer</button>
          </div>
          <div class="sf">
            <div class="si">${IC.searchD}</div>
            <input id="csq" placeholder="Type name, phone, or pet name..."
              value="${S.query.replace(/"/g,'&quot;')}"
              oninput="setQ(this.value)" autocomplete="off"/>
          </div>
          ${res.length>0?`<div class="results">${res.map(c=>`
            <button class="rrow" onclick="pickCx(${c.id})">
              <div class="rav">${inits(c.name)}</div>
              <div><div class="rname">${c.name}</div><div class="rphone">${c.phone}</div></div>
              <div class="ptags">${c.pets.map(p=>`<span class="ptag">${p.name}</span>`).join("")}</div>
            </button>`).join("")}</div>`:""}
          ${q.length>1&&res.length===0?`<div class="nr">No customers found. <button onclick="showNewForm()">Create new?</button></div>`:""}
        </div>
      </div>`;
    } else {
      cxSec=`<div>
        <div class="sec-lbl">Customer</div><div class="sec-sub">Select or create a customer</div>
        <div class="card">
          <button class="fbk" onclick="hideNewForm()">← Back to search</button>
          <div style="font-weight:600;font-size:14px;color:#001d34;margin-bottom:14px">New Customer</div>
          <div class="ncgrid">
            <div><label class="fclbl">Full Name *</label><input class="fci" id="nc-name" placeholder="e.g. Priya Sharma" autocomplete="off"/></div>
            <div><label class="fclbl">Phone *</label><input class="fci" id="nc-phone" placeholder="e.g. 512-891-5540" autocomplete="off"/></div>
            <div class="fsp"><label class="fclbl">Email</label><input class="fci" id="nc-email" placeholder="e.g. name@email.com" autocomplete="off"/></div>
            <div><label class="fclbl">Pet Name *</label><input class="fci" id="nc-pn" placeholder="e.g. Bentley" autocomplete="off"/></div>

  } else {
    const mp=S.cx.pets.length>1;
    const chips=mp?`<div>
      <div class="pt-lbl">Select pet for this booking</div>
      <div class="pet-select-row">${S.cx.pets.map(p=>{
        const sel=S.selectedPetId===p.id;
        return`<button class="pet-chip ${sel?'sel':''}" onclick="selPet(${p.id})">
          <div class="pet-chip-dot"></div>${p.name}
          <span style="font-weight:400;font-size:11px;color:${sel?'#b7141d':'#94a3b8'}"> · ${p.breed}</span>
        </button>`;

      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px">
        <div><div class="sec-lbl">Customer</div><div class="sec-sub">Select or create a customer</div></div>

      </div>
      <div class="cust-card">
        <div class="cav">${inits(S.cx.name)}</div>
        <div style="flex:1">
          <div class="cname">${S.cx.name}</div>
          <div class="ccontact">
            <div class="cci">${IC.eml} ${S.cx.email}</div>
            <div class="cci">${IC.phn} ${S.cx.phone}</div>

          ${chips}
        </div>
      </div>
    </div>`;

    <div class="sec-lbl">Booking Type</div><div class="sec-sub">Defines the type of visit</div>
    <div class="bt-grid">
      ${[{id:"Grooming",ic:IC.grm},{id:"Daycare",ic:IC.day},{id:"Boarding",ic:IC.brd}].map(t=>{
        const a=S.bt===t.id;
        return`<button class="btc${a?' active':''}" onclick="setBT('${t.id}')">
          ${a?`<div class="bt-check">${IC.chkGn}</div>`:""}
          <div class="bt-icon ${a?'a':'i'}" style="color:${a?'#b7141d':'#475569'}">${t.ic}</div>
          <div class="bt-name">${t.id}</div>
        </button>`;
      }).join("")}
    </div>
  </div>`;

  // Service section
  let svcSec="";
  if(!S.cx||!S.bt){
    svcSec=`<div>
      <div class="sec-lbl">Service</div><div class="sec-sub">Choose services for this booking</div>
      <div class="svc-locked">${IC.lock}<div class="svc-locked-text">Services will be available once a<br/>customer is chosen.</div></div>
    </div>`;
  } else {
    const cardsH=S.cards.map((card,ci)=>{
      const pet=S.cx.pets.find(p=>p.id===card.petId)||S.cx.pets[0];
      const cardSvcs=SVCS[card.btType];
      const cardAdns=ALL_ADDONS[card.btType];
      const mainAdns=cardAdns.slice(0,2);
      const extraAdns=cardAdns.slice(2);

      const allAdnsHTML=cardAdns.map(a=>{
        const chk=!!card.addons.find(x=>x.id===a.id);
        return`<button class="adchip" onclick="togAddon(${ci},'${a.id}')">
          <div class="cbx ${chk?'chk':'unchk'}">${chk?IC.chkW:""}</div>
          ${a.label} (+$${a.price})
        </button>`;
      }).join("");

      const mainAdnsHTML=mainAdns.map(a=>{
        const chk=!!card.addons.find(x=>x.id===a.id);
        return`<button class="adchip" onclick="togAddon(${ci},'${a.id}')">
          <div class="cbx ${chk?'chk':'unchk'}">${chk?IC.chkW:""}</div>
          ${a.label} (+$${a.price})
        </button>`;
      }).join("");

      // Type badge for mixed bookings
      const typeBadge=S.cards.length>1?`<span style="display:inline-flex;align-items:center;gap:4px;background:${card.btType==='Grooming'?'rgba(183,20,29,0.08)':card.btType==='Daycare'?'rgba(234,179,8,0.1)':'rgba(79,110,247,0.1)'};color:${card.btType==='Grooming'?'#b7141d':card.btType==='Daycare'?'#92400e':'#4f6ef7'};border-radius:99px;padding:2px 10px;font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;">${card.btType==='Grooming'?IC.grm.replace('currentColor','currentColor'):card.btType==='Daycare'?IC.day.replace('currentColor','currentColor'):IC.brd.replace('currentColor','currentColor')} ${card.btType}</span>`:"";

      return`<div class="pfc">
        ${S.cards.length>1?`<button class="pfc-close" onclick="removeCard(${ci})" title="Remove">${IC.close}</button>`:""}
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${typeBadge||pet?.alert?'10px':'0'}">
          <div>${typeBadge}</div>
          ${pet?.alert?`<div style="background:#fee2e2;border-radius:99px;padding:2px 9px;font-size:9px;font-weight:700;color:#dc2626;letter-spacing:1px;text-transform:uppercase;">${pet.alert}</div>`:""}
        </div>
        <div class="pfc-head" style="margin-top:${pet?.alert?'20px':'0'}">
          <div style="display:flex;gap:12px;align-items:flex-start">
            <div class="pp">${pet?.name?.[0]||"?"}</div>
            <div style="margin-top:3px">
              <div class="pname">${pet?.name||""}</div>
              <div class="pbreed">${pet?.breed||""}</div>
              <div class="page">${fmtAge(pet?.age||"")}</div>
            </div>
          </div>
          ${pet?.vax?`<div class="vax">${IC.vax}<div><div class="vax-t">Vaccinations</div><div class="vax-v">Up to date</div></div></div>`:""}
        </div>
        <div class="fl">
          <div class="flbl">${SVC_LBL[card.btType]||"Service"}</div>
          <div class="fsw">
            <select class="fsel" onchange="updCard(${ci},'svcId',this.value)">
              ${cardSvcs.map(x=>`<option value="${x.id}"${x.id===card.svcId?" selected":""}>${x.label}</option>`).join("")}
            </select>
            <div class="fsw-ic">${IC.chev}</div>
          </div>
        </div>
        <div class="twofl">
          <div class="fl" style="margin-bottom:0"><div class="flbl">Service Date</div>
            <div class="fwi"><div class="fi">${IC.cal}</div>
              <input class="finp" style="padding-left:32px" value="${card.date}" onchange="updCard(${ci},'date',this.value)"/>
            </div>
          </div>
          <div class="fl" style="margin-bottom:0"><div class="flbl">Time</div>
            <div class="fwi"><div class="fi">${IC.clk}</div>
              <input class="finp" style="padding-left:32px" value="${card.time}" onchange="updCard(${ci},'time',this.value)"/>
            </div>
          </div>
        </div>
        <div class="fl">
          <div class="flbl">Preferred Groomer</div>
          <div class="fsw">
            <select class="fsel" onchange="updCard(${ci},'groomer',this.value)">
              ${GROOMERS.map(g=>`<option value="${g.id}"${g.id===card.groomer?" selected":""}>${g.name}  ${g.available?"(Available)":"(Unavailable)"}</option>`).join("")}
            </select>
            <div class="fsw-ic">${IC.chev}</div>
          </div>
        </div>
        <div class="fl">
          <div class="flbl">Add-on Services</div>
          <div class="adw">${card.showAllAddons?allAdnsHTML:mainAdnsHTML}</div>
          <button class="view-all" onclick="toggleAllAddons(${ci})">
            ${card.showAllAddons?`${IC.chevUp} Show less`:`${IC.chev} View all add-ons (${cardAdns.length})`}
          </button>

        </div>
        <div class="fl instr">
          <div class="flbl">Specific Instructions</div>
          <textarea placeholder="e.g., Short cut on belly, leave tail fluffy..."
            onchange="updCard(${ci},'instr',this.value)">${card.instr}</textarea>
        </div>
      </div>`;
    }).join("");

    svcSec=`<div>
      <div class="svc-hdr">
        <div><div class="sec-lbl">Service</div><div class="sec-sub">Choose services for this booking</div></div>
        <button class="add-pet-btn" onclick="openModal()">
          ${IC.plusR} Add Another Pet or Service
        </button>
      </div>
      ${cardsH}
    </div>`;
  }

  // Summary
  let sumContent="";
  if(!S.cx){
    sumContent=`<div class="empty-ic">${IC.bkgs}</div>
      <div class="empty-t">No Customer Selected</div>
      <div class="empty-tx">Start by finding a customer. We'll automatically pull up their preferred services, pet medical alerts, and booking history.</div>`;
  } else {
    const lineItems=S.cards.map(card=>{
      const svcs=SVCS[card.btType];
      const svc=svcs.find(x=>x.id===card.svcId)||svcs[0];
      const pet=S.cx.pets.find(p=>p.id===card.petId);
      return{pet,svc,addons:card.addons,sub:(svc?.price||0)+card.addons.reduce((t,a)=>t+a.price,0),bt:card.btType};
    });
    const grand=lineItems.reduce((t,x)=>t+x.sub,0);
    const fmt=S.cards[0]?.date?S.cards[0].date.replace(/(\d{2})\/(\d{2})\/(\d{4})/,(_,m,d,y)=>{
      const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return`${mo[parseInt(m)-1]} ${parseInt(d)}, ${y}`;
    }):"";
    const ready=S.cx&&S.bt&&S.cards.length>0;
    sumContent=`
      <div class="srow"><div class="sic">${IC.own}</div>
        <div><div class="slbl">Owner &amp; Pet(s)</div>
          <div class="sval">${S.cx.name}</div>
          <div class="ssub">${S.cards.map(c=>S.cx.pets.find(x=>x.id===c.petId)?.name||"?").join(", ")||S.cx.pets.map(p=>p.name).join(", ")}</div>
        </div>
      </div>
      ${fmt?`<div class="srow"><div class="sic">${IC.dte}</div>
        <div><div class="slbl">Date &amp; Time</div>
          <div class="sval">${fmt}</div>
          <div class="ssub">Arrival: ${S.cards[0]?.time||""}</div>
        </div>
      </div>`:""}
      ${lineItems.length>0?`<div class="litems">
        ${lineItems.map(x=>`
          <div class="li-pet-hdr">${x.pet?.name||""} — ${x.bt}</div>
          <div class="li"><span class="ln">${x.svc.label}</span><span class="lp">$${x.svc.price}.00</span></div>
          ${x.addons.map(a=>`<div class="li"><span class="ln"> ↳ ${a.label}</span><span class="lp">$${a.price}.00</span></div>`).join("")}
        `).join("")}
        <div class="trow"><span class="tl">Total</span><span class="tp">$${grand}.00</span></div>
      </div>`:""}
      <button class="cfm-btn ${ready?'ok':'no'}" onclick="${ready?'doConfirm()':''}">
        CONFIRM BOOKING ${ready?IC.arr:""}
      </button>
      <button class="draft-btn">Save as Draft</button>`;
  }

  el.innerHTML=`<div class="app">
    ${sH}<div class="main">${tH}
      <div class="page-wrap"><div class="content">
        <div class="breadcrumb"><span>Bookings</span>
          <svg width="5" height="8" viewBox="0 0 5 8" fill="none"><path d="M1 1l3 3-3 3" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/></svg>
          <span class="cur">New Appointment</span>
        </div>
        <div class="page-title">Schedule Service</div>
        <div class="page-sub">${S.cx?"Create a new reservation for a customer. Choose a customer to get started.":"Create a new reservation for a customer. Choose your service type to get started."}</div>
        ${stH}
        <div class="two-col">
          <div class="left-col">${cxSec}${btSec}${svcSec}</div>
          <div class="right-col"><div class="sum-card"><div class="sum-title">Booking Summary</div>${sumContent}</div></div>
        </div>
      </div></div>
    </div>
  </div>`;

  // Restore new customer form values
  if(S.showNew){
    const fields={name:"nc-name",email:"nc-email",phone:"nc-phone",pn:"nc-pn",pb:"nc-pb"};
    Object.entries(fields).forEach(([k,id])=>{const el=document.getElementById(id);if(el)el.value=NC[k];});
  }
  renderModal();
}

// ─── Modal: Add Another Pet or Service ────────────────────────────────────────
function renderModal(){
  const root=document.getElementById("modal-root");if(!root)return;
  if(!S.showModal){root.innerHTML="";return;}

  const pets=S.cx?.pets||[];
  const usedIds=S.cards.map(c=>c.petId);
  const availPets=pets.filter(p=>!usedIds.includes(p.id));

  // Options: each available pet × each booking type, plus same pets with different booking types
  const petOpts=availPets.map(p=>`
    <button class="modal-btn" onclick="addCardPetBT(${p.id},'${S.bt}')">
      <div class="modal-btn-icon" style="color:#b7141d">${IC.dog}</div>
      <div>
        <div class="modal-btn-label">${p.name} — ${S.bt}</div>
        <div class="modal-btn-sub">${p.breed} · ${fmtAge(p.age)}</div>
      </div>
    </button>`).join("");

  // Mixed booking type options for pets already in cards
  const mixedOpts=S.cards.flatMap(card=>{
    const pet=pets.find(p=>p.id===card.petId);
    if(!pet)return[];
    return BT_ALL.filter(bt=>bt!==card.btType).map(bt=>`
      <button class="modal-btn" onclick="addCardPetBT(${pet.id},'${bt}')">
        <div class="modal-btn-icon" style="color:${bt==='Daycare'?'#92400e':'#4f6ef7'}">${bt==='Grooming'?IC.grm:bt==='Daycare'?IC.day:IC.brd}</div>
        <div>
          <div class="modal-btn-label">${pet.name} — ${bt}</div>
          <div class="modal-btn-sub">Add ${bt} to this visit</div>
        </div>
      </button>`);
  }).join("");

  const hasOpts=(petOpts||mixedOpts);

  root.innerHTML=`<div class="modal-overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">Add Another Pet or Service</div>
      <div class="modal-sub">Choose what to add to this booking</div>
      <div class="modal-opt">
        ${petOpts}
        ${mixedOpts}
        ${!hasOpts?`<div style="text-align:center;padding:16px;font-size:13px;color:#94a3b8">All pets and service combinations have been added.</div>`:""}
      </div>
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>`;
}

// ─── Handlers ─────────────────────────────────────────────────────────────────
function setQ(v){S.query=v;render();const el=document.getElementById("csq");if(el){el.focus();el.setSelectionRange(v.length,v.length);}}
function showNewForm(){S.showNew=true;S.err="";render();document.getElementById("nc-name")?.focus();}
function hideNewForm(){S.showNew=false;S.err="";NC={name:"",email:"",phone:"",pn:"",pb:"",sz:"Small"};render();}
function setSz(v){NC.sz=v;document.querySelectorAll(".szbtn").forEach(b=>{b.className="szbtn "+(b.textContent.trim()===v?"sel":"unsel");});}

function pickCx(id){
  const c=CX.find(x=>x.id===id);if(!c)return;
  S.cx=c;S.query="";S.selectedPetId=c.pets[0].id;
  S.cards=[initCard(c.pets[0].id,S.bt)];render();
}
function selPet(pid){
  S.selectedPetId=pid;
  if(S.cards.length===1)S.cards[0].petId=pid;
  render();
}
function clearCx(){S.cx=null;S.cards=[];S.selectedPetId=null;S.query="";render();}
function setBT(t){
  S.bt=t;
  // Only reset the first card's type; leave others as-is if mixed
  if(S.cards.length>0){
    S.cards[0].btType=t;
    S.cards[0].svcId=SVCS[t][0].id;
    S.cards[0].addons=[ALL_ADDONS[t][0]];
  }
  render();
}
function updCard(i,k,v){if(S.cards[i])S.cards[i][k]=v;}
function togAddon(ci,aid){
  if(!S.cards[ci])return;
  const a=ALL_ADDONS[S.cards[ci].btType].find(x=>x.id===aid);if(!a)return;
  const has=S.cards[ci].addons.find(x=>x.id===aid);
  S.cards[ci].addons=has?S.cards[ci].addons.filter(x=>x.id!==aid):[...S.cards[ci].addons,a];
  render();
}
function toggleAllAddons(ci){
  if(!S.cards[ci])return;
  S.cards[ci].showAllAddons=!S.cards[ci].showAllAddons;
  render();
}
function openModal(){S.showModal=true;renderModal();}
function closeModal(){S.showModal=false;renderModal();}
function addCardPetBT(petId,bt){
  S.cards.push(initCard(petId,bt));
  S.showModal=false;
  render();
}
function removeCard(i){S.cards.splice(i,1);render();}

function createCx(){
  NC.name=document.getElementById("nc-name")?.value.trim()||"";
  NC.email=document.getElementById("nc-email")?.value.trim()||"";
  NC.phone=document.getElementById("nc-phone")?.value.trim()||"";
  NC.pn=document.getElementById("nc-pn")?.value.trim()||"";
  NC.pb=document.getElementById("nc-pb")?.value.trim()||"";
  const errEl=document.getElementById("nc-err");
  function showErr(msg){if(errEl){errEl.textContent="⚠ "+msg;errEl.style.display="block";}}
  if(!NC.name){showErr("Customer name is required.");return;}
  if(!NC.phone){showErr("Phone is required.");return;}
  if(!NC.pn){showErr("Pet name is required.");return;}
  const c={id:Date.now(),name:NC.name,email:NC.email||"—",phone:NC.phone,
    pets:[{id:Date.now()+1,name:NC.pn,breed:NC.pb||"Unknown",age:"1y",size:NC.sz,alert:null,vax:true}]};
  S.cx=c;S.showNew=false;S.err="";S.selectedPetId=c.pets[0].id;
  S.cards=[initCard(c.pets[0].id,S.bt)];
  NC={name:"",email:"",phone:"",pn:"",pb:"",sz:"Small"};
  render();
}
function doConfirm(){S.confirmed=true;render();}
function resetApp(){
  S={cx:null,bt:"Grooming",selectedPetId:null,cards:[],confirmed:false,query:"",showNew:false,err:"",showModal:false};
  NC={name:"",email:"",phone:"",pn:"",pb:"",sz:"Small"};
  render();
}
render();
</script>
</body>
</html>
